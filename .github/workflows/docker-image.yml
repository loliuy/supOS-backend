name: CI Build & Push (no-Dockerfile-change)

on:
  push:
    branches: [ "main" ]        # 按需修改
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'     # 或 21，与项目一致

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Maven build (generate lombok code here)
        run: mvn -B -U clean package -DskipTests

      # 查找要打包的 JAR（假设在 bootstrap 模块）
      - name: Locate JAR
        id: jar
        run: |
          JAR_PATH=$(ls -1 bootstrap/target/bootstrap*.jar | head -n1)
          if [ -z "$JAR_PATH" ]; then
            echo "No JAR found under bootstrap/target/" >&2
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT

      # 生成一个“临时的运行层 Dockerfile”，不改你仓库的 Dockerfile
      - name: Generate runtime Dockerfile
        run: |
          cat > Dockerfile.runtime <<'EOF'
          FROM eclipse-temurin:17-jdk
          WORKDIR /app
          ARG APP_JAR=app.jar
          COPY app.jar /app/app.jar

          RUN ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime && \
              echo 'Asia/Shanghai' >/etc/timezone && \
              mkdir -p /data/apps /data/resource/i18n

          # 解包 i18n（需要 jar 命令，故用 JDK 基础镜像）
          RUN cd /tmp/ && jar -xf /app/app.jar && \
              cp /tmp/BOOT-INF/classes/i18n/*.properties /data/resource/i18n || true

          EXPOSE 8080 19099 8000
          ENTRYPOINT ["sh","-c","java $MEM_OPTS $JAVA_OPTS -Djava.security.egd=file:/dev/./urandom -Dlogging.file.name=./logs/supos.log -jar /app/app.jar"]
          EOF

          # 将编好的 JAR 放到构建上下文根目录，名为 app.jar
          cp "${{ steps.jar.outputs.jar_path }}" app.jar

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push (multi-arch) with temp Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime     # 用临时 Dockerfile，不动你仓库里的那个
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            suposce/supos-ce-backend:latest
            suposce/supos-ce-backend:${{ github.sha }}
            suposce/supos-ce-backend:1.0.13-T2
          cache-from: type=gha
          cache-to: type=gha,mode=max
